x-api-environment: &api-environment
  NODE_ENV: development
  PORT: 3000
  DATABASE_URL: mysql://app:local_password@mysql:3306/app
  TEST_DATABASE_URL: mysql://app:local_password@mysql:3306/app_test
  ACCESS_TOKEN_SECRET: local_only_replace_before_any_shared_deployment
  ACCESS_TOKEN_EXPIRES_IN: 10m
  ACCESS_TOKEN_ISSUER: predator-backend
  ACCESS_TOKEN_AUDIENCE: predator-clients
  REFRESH_TOKEN_EXPIRES_IN_DAYS: 30
  REFRESH_COOKIE_NAME: app_refresh_token
  COOKIE_SECURE: 'false'
  COOKIE_SAME_SITE: lax
  CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
  LOG_LEVEL: debug
  TRUST_PROXY: 'false'
  JSON_BODY_LIMIT: 100kb
  RATE_LIMIT_WINDOW_MS: 900000
  RATE_LIMIT_MAX: 100
  LOGIN_RATE_LIMIT_WINDOW_MS: 900000
  LOGIN_RATE_LIMIT_MAX: 5
  REQUEST_TIMEOUT_MS: 30000
  HEADERS_TIMEOUT_MS: 15000
  KEEP_ALIVE_TIMEOUT_MS: 5000
  SHUTDOWN_TIMEOUT_MS: 10000
  SERVE_FRONTEND: 'false'
  FRONTEND_DIST_PATH: ''

services:
  mysql:
    image: mysql:8.4.10
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: local_password
      MYSQL_ROOT_PASSWORD: local_root_password
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  migrate:
    build:
      context: .
      target: migrations
    environment: *api-environment
    depends_on:
      mysql:
        condition: service_healthy
    restart: 'no'

  migrate-test:
    build:
      context: .
      target: migrations
    environment:
      <<: *api-environment
      NODE_ENV: test
    depends_on:
      mysql:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      target: development
    environment: *api-environment
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      migrate-test:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  mysql_data:
