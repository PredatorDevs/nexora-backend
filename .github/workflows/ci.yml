name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4.10
        env:
          MYSQL_DATABASE: app_test
          MYSQL_USER: app
          MYSQL_PASSWORD: test_password
          MYSQL_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: mysql://app:test_password@127.0.0.1:3306/app
      TEST_DATABASE_URL: mysql://app:test_password@127.0.0.1:3306/app_test
      ACCESS_TOKEN_SECRET: ci_only_access_token_secret_at_least_32_characters
      ACCESS_TOKEN_EXPIRES_IN: 10m
      ACCESS_TOKEN_ISSUER: predator-backend-ci
      ACCESS_TOKEN_AUDIENCE: predator-clients-ci
      REFRESH_TOKEN_EXPIRES_IN_DAYS: 1
      REFRESH_COOKIE_NAME: ci_refresh_token
      COOKIE_SECURE: 'false'
      COOKIE_SAME_SITE: lax
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      LOG_LEVEL: error
      TRUST_PROXY: 'false'
      JSON_BODY_LIMIT: 100kb
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 1000
      LOGIN_RATE_LIMIT_WINDOW_MS: 900000
      LOGIN_RATE_LIMIT_MAX: 100
      REQUEST_TIMEOUT_MS: 30000
      HEADERS_TIMEOUT_MS: 15000
      KEEP_ALIVE_TIMEOUT_MS: 5000
      SHUTDOWN_TIMEOUT_MS: 10000
      SERVE_FRONTEND: 'false'
      FRONTEND_DIST_PATH: ''

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run prisma:validate
      - run: npm run prisma:generate
      - run: npm run prisma:deploy
      - run: npm test
      - run: docker build --target production --tag predator-backend-boilerplate:ci .

  artifact:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build deterministic release bundle
        run: |
          mkdir release-bundle
          cp package.json package-lock.json release-bundle/
          cp -R src prisma scripts public release-bundle/
          npm sbom --sbom-format cyclonedx > sbom.cdx.json
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          npm run artifact:manifest
          npm run artifact:verify
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner -cf - release-bundle | gzip -n > predator-backend-${GITHUB_SHA}.tar.gz
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner -cf - release-bundle | gzip -n > reproducibility-check.tar.gz
          cmp predator-backend-${GITHUB_SHA}.tar.gz reproducibility-check.tar.gz
          sha256sum predator-backend-${GITHUB_SHA}.tar.gz > predator-backend-${GITHUB_SHA}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: predator-backend-${{ github.sha }}
          path: |
            predator-backend-${{ github.sha }}.tar.gz
            predator-backend-${{ github.sha }}.tar.gz.sha256
            sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
